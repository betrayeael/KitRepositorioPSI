<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kit de Recopilación de Datos - Fase I</title>

    <script>
        const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const baseHref = isLocalhost ? '/' : '/KitRepositorioPSI/';
        document.write('<base href="' + baseHref + '" />');
    </script>

    <script>
        const originalWarn = console.warn;
        console.warn = function (...args) {
            if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) {
                return; // Ignora el aviso de Tailwind en producción de forma silenciosa
            }
            originalWarn.apply(console, args);
        };
    </script>

    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="css/app.css" rel="stylesheet" />
    <link href="KitRecopilacionDatos.styles.css" rel="stylesheet" />

    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-[#F5F5F7]">
    <div id="app">
        <div class="min-h-screen flex flex-col items-center justify-center bg-[#F5F5F7]">
            <div class="flex flex-col items-center space-y-4">
                <div class="w-12 h-12 rounded-2xl bg-indigo-600 animate-pulse flex items-center justify-center text-white font-bold">
                    Ω
                </div>
                <p class="text-xs font-semibold tracking-wider text-gray-400 uppercase animate-pulse">
                    Cargando Entorno Metodológico...
                </p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" class="hidden fixed bottom-0 left-0 w-full bg-red-50 border-t border-red-200 p-4 z-50 text-xs text-red-800 font-medium justify-between items-center">
        Ha ocurrido un error crítico en la aplicación WebAssembly.
        <a href="" class="reload bg-red-600 text-white px-3 py-1 rounded-lg font-bold ml-4">Recargar</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getFirestore, doc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        // Declaramos explícitamente el objeto que espera recibir App.razor en C#
        window.FirebaseInterop = {
            firestoreDb: null,

            // Inicialización controlada asíncrona
            initialize: async function (configJson) {
                try {
                    const firebaseConfig = JSON.parse(configJson);
                    const app = initializeApp(firebaseConfig);

                    // Asignamos la instancia activa de la base de datos de manera interna
                    this.firestoreDb = getFirestore(app);

                    console.log("Infraestructura NoSQL de Firestore vinculada exitosamente al ciclo de vida de Blazor.");
                    return true;
                } catch (error) {
                    console.error("Fallo crítico en el bootstrapping modular de Firebase:", error);
                    return false;
                }
            },

            // Persistencia asíncrona hacia las colecciones de Firestore
            saveProjectData: async function (projectId, jsonData) {
                try {
                    if (!this.firestoreDb) {
                        console.warn("La base de datos de Firestore no se encuentra lista para transaccionar.");
                        return false;
                    }
                    const dataObject = JSON.parse(jsonData);
                    if (!dataObject.metadata) dataObject.metadata = {};
                    dataObject.metadata.last_updated = new Date().toISOString();

                    const docRef = doc(this.firestoreDb, "proyectos_fase1", projectId);
                    await setDoc(docRef, dataObject, { merge: true });
                    return true;
                } catch (error) {
                    console.error("Error de escritura interceptado en FirebaseInterop.saveProjectData:", error);
                    return false;
                }
            },

            // Escucha reactiva en tiempo real acoplada al State Container
            listenToProject: function (projectId, dotNetRef) {
                try {
                    if (!this.firestoreDb) return null;
                    const docRef = doc(this.firestoreDb, "proyectos_fase1", projectId);

                    return onSnapshot(docRef, (snapshot) => {
                        if (snapshot.exists()) {
                            const jsonString = JSON.stringify(snapshot.data());
                            dotNetRef.invokeMethodAsync("ReceiveProjectUpdate", jsonString);
                        }
                    });
                } catch (error) {
                    console.error("Error en el canal activo de datos reactivos (onSnapshot):", error);
                }
            }
        };
    </script>
</body>
</html>
